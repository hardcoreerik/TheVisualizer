[workspace]
members = ["plugin-sdk", "plugins/example", "plugins/creative-suite"]
default-members = [".", "plugins/example", "plugins/creative-suite"]
resolver = "3"

[package]
name = "thevisualizer"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
bytemuck = "1.25.0"
cpal = "0.18.1"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
gltf = { version = "1.4.1", features = ["import"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8.9"
midir = "0.11.0"
pollster = "0.4.0"
rosc = "0.11.4"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thevisualizer-plugin-sdk = { path = "plugin-sdk" }
